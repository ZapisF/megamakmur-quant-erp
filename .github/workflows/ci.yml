name: Mega Makmur Quant ERP CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit and integration test suite
        run: |
          PYTHONPATH=src pytest -v

      - name: Verify CLI commands on production seed data
        run: |
          PYTHONPATH=src python -m megamakmur.cli radar --csv data/scouting_radar_2026_10_31.csv
          PYTHONPATH=src python -m megamakmur.cli allocate --csv data/scouting_radar_2026_10_31.csv --capital 1000000000
          PYTHONPATH=src python -m megamakmur.cli reconcile --jobs data/workshop_jobs_2026_10.csv --mutations data/bank_qris_mutations_2026_10.csv
